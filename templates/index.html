<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Multi AI Agents Research</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Source+Serif+4:wght@400;600&display=swap"
        rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --ink: #0d1030;
            --panel: #151a45;
            --line: #2a3170;
            --text: #e9ecff;
            --muted: #9aa2d6;
            --violet: #7c6cff;
            --mint: #4fe3c1;
            --amber: #ffb86b;
            --rose: #ff7a90;
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html {
            scroll-behavior: smooth
        }

        body {
            font-family: 'Bricolage Grotesque', system-ui, sans-serif;
            background: var(--ink);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden
        }

        #bg {
            position: fixed;
            inset: 0;
            z-index: 0
        }

        main {
            position: relative;
            z-index: 1;
            max-width: 1040px;
            margin: 0 auto;
            padding: 64px 22px 90px
        }

        /* hero: one orchestrated load moment */
        h1 {
            font-size: clamp(2.2rem, 6vw, 4.2rem);
            font-weight: 800;
            line-height: 1.02;
            letter-spacing: -.03em
        }

        h1 span {
            display: inline-block;
            opacity: 0;
            transform: translateY(40px) rotate(3deg);
            animation: rise .8s cubic-bezier(.2, .9, .2, 1) forwards
        }

        @keyframes rise {
            to {
                opacity: 1;
                transform: none
            }
        }

        .sub {
            color: var(--muted);
            margin-top: 18px;
            max-width: 560px;
            font-size: 1.05rem;
            line-height: 1.55;
            opacity: 0;
            animation: fade 1s .9s forwards
        }

        @keyframes fade {
            to {
                opacity: 1
            }
        }

        /* search bar */
        .ask {
            display: flex;
            gap: 10px;
            margin-top: 34px;
            padding: 8px;
            border: 1px solid var(--line);
            border-radius: 18px;
            background: rgba(21, 26, 69, .75);
            backdrop-filter: blur(10px);
            opacity: 0;
            animation: fade 1s 1.1s forwards;
            transition: box-shadow .3s, border-color .3s
        }

        .ask:focus-within {
            border-color: var(--violet);
            box-shadow: 0 0 0 4px rgba(124, 108, 255, .2), 0 10px 40px rgba(124, 108, 255, .25)
        }

        .ask input {
            flex: 1;
            background: none;
            border: 0;
            outline: 0;
            color: var(--text);
            font: inherit;
            font-size: 1.05rem;
            padding: 12px 14px;
            min-width: 0
        }

        .ask input::placeholder {
            color: #6f77b5
        }

        .ask button {
            border: 0;
            border-radius: 12px;
            padding: 0 26px;
            font: inherit;
            font-weight: 600;
            color: #0d1030;
            background: linear-gradient(120deg, var(--mint), var(--violet));
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: transform .2s, filter .2s
        }

        .ask button:hover {
            transform: translateY(-2px);
            filter: brightness(1.1)
        }

        .ask button:active {
            transform: scale(.96)
        }

        .ask button:disabled {
            filter: grayscale(.7) brightness(.7);
            cursor: wait;
            transform: none
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
            opacity: 0;
            animation: fade 1s 1.3s forwards
        }

        .chips button {
            background: none;
            border: 1px solid var(--line);
            color: var(--muted);
            border-radius: 99px;
            padding: 6px 14px;
            font: inherit;
            font-size: .85rem;
            cursor: pointer;
            transition: .2s
        }

        .chips button:hover {
            color: var(--text);
            border-color: var(--violet);
            background: rgba(124, 108, 255, .12)
        }

        /* pipeline: the memorable element */
        .pipe {
            position: relative;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-top: 56px
        }

        .pipe::before {
            content: "";
            position: absolute;
            left: 12%;
            right: 12%;
            top: 38px;
            height: 2px;
            background: var(--line)
        }

        .pipe .fill {
            position: absolute;
            left: 12%;
            top: 38px;
            height: 2px;
            width: 0;
            background: linear-gradient(90deg, var(--mint), var(--violet));
            transition: width .9s ease;
            box-shadow: 0 0 12px var(--mint)
        }

        .node {
            position: relative;
            text-align: center;
            padding-top: 6px
        }

        .orb {
            width: 64px;
            height: 64px;
            margin: 0 auto;
            border-radius: 50%;
            display: grid;
            place-items: center;
            background: var(--panel);
            border: 2px solid var(--line);
            font-size: 1.6rem;
            position: relative;
            transition: .5s
        }

        .node.active .orb {
            border-color: var(--mint);
            box-shadow: 0 0 0 0 rgba(79, 227, 193, .6);
            animation: pulse 1.4s infinite;
            transform: scale(1.12)
        }

        .node.active .orb::after {
            content: "";
            position: absolute;
            inset: -9px;
            border-radius: 50%;
            border: 2px dashed var(--mint);
            border-right-color: transparent;
            animation: spin 2s linear infinite
        }

        .node.done .orb {
            border-color: var(--violet);
            background: var(--violet);
            transform: scale(1);
            animation: pop .5s
        }

        .node.error .orb {
            border-color: var(--rose);
            background: rgba(255, 122, 144, .2)
        }

        @keyframes pulse {
            70% {
                box-shadow: 0 0 0 18px rgba(79, 227, 193, 0)
            }

            100% {
                box-shadow: 0 0 0 0 rgba(79, 227, 193, 0)
            }
        }

        @keyframes spin {
            to {
                transform: rotate(360deg)
            }
        }

        @keyframes pop {
            0% {
                transform: scale(.7)
            }

            60% {
                transform: scale(1.25)
            }

            100% {
                transform: scale(1)
            }
        }

        .node b {
            display: block;
            margin-top: 12px;
            font-size: .98rem
        }

        .node small {
            color: var(--muted);
            font-size: .8rem;
            display: block;
            margin-top: 2px
        }

        .node.active small {
            color: var(--mint)
        }

        /* results */
        .results {
            margin-top: 46px;
            display: none
        }

        .results.show {
            display: block;
            animation: fade .6s forwards
        }

        .tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            border-bottom: 1px solid var(--line);
            position: relative
        }

        .tab {
            background: none;
            border: 0;
            color: var(--muted);
            font: inherit;
            padding: 12px 18px;
            cursor: pointer;
            position: relative;
            transition: color .2s
        }

        .tab:hover,
        .tab.on {
            color: var(--text)
        }

        .tab .dot {
            display: inline-block;
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--line);
            margin-right: 8px;
            transition: .3s
        }

        .tab.ready .dot {
            background: var(--mint);
            box-shadow: 0 0 8px var(--mint)
        }

        .ink {
            position: absolute;
            bottom: -1px;
            height: 2px;
            background: var(--mint);
            transition: left .35s, width .35s
        }

        .panel {
            margin-top: 22px;
            background: rgba(21, 26, 69, .8);
            border: 1px solid var(--line);
            border-radius: 20px;
            padding: 34px clamp(20px, 4vw, 48px);
            min-height: 180px;
            animation: slide .5s
        }

        @keyframes slide {
            from {
                opacity: 0;
                transform: translateY(14px)
            }
        }

        .panel .empty {
            color: var(--muted)
        }

        .md {
            font-family: 'Source Serif 4', Georgia, serif;
            font-size: 1.06rem;
            line-height: 1.75;
            max-width: 74ch;
            overflow-wrap: anywhere
        }

        .md h1,
        .md h2,
        .md h3 {
            font-family: 'Bricolage Grotesque', sans-serif;
            margin: 1.4em 0 .5em;
            line-height: 1.2;
            letter-spacing: -.01em
        }

        .md h1 {
            font-size: 1.9rem
        }

        .md h2 {
            font-size: 1.45rem;
            color: var(--mint)
        }

        .md h3 {
            font-size: 1.15rem
        }

        .md p,
        .md ul,
        .md ol {
            margin: .8em 0
        }

        .md li {
            margin: .3em 0
        }

        .md a {
            color: var(--amber)
        }

        .md code {
            background: #0d1030;
            padding: 2px 6px;
            border-radius: 6px;
            font-size: .9em
        }

        .md pre {
            background: #0d1030;
            padding: 16px;
            border-radius: 12px;
            overflow: auto
        }

        .md blockquote {
            border-left: 3px solid var(--violet);
            padding-left: 16px;
            color: var(--muted)
        }

        .md table {
            border-collapse: collapse;
            width: 100%;
            display: block;
            overflow: auto
        }

        .md td,
        .md th {
            border: 1px solid var(--line);
            padding: 8px 12px
        }

        .typing::after {
            content: "▋";
            color: var(--mint);
            animation: blink 1s steps(2) infinite
        }

        @keyframes blink {
            50% {
                opacity: 0
            }
        }

        .tools {
            display: flex;
            justify-content: flex-end;
            margin-top: 12px
        }

        .tools button {
            background: none;
            border: 1px solid var(--line);
            color: var(--muted);
            padding: 7px 16px;
            border-radius: 10px;
            font: inherit;
            font-size: .85rem;
            cursor: pointer;
            transition: .2s
        }

        .tools button:hover {
            color: var(--text);
            border-color: var(--mint)
        }

        .err {
            margin-top: 26px;
            padding: 16px 20px;
            border: 1px solid var(--rose);
            background: rgba(255, 122, 144, .1);
            border-radius: 14px;
            display: none;
            animation: shake .4s
        }

        @keyframes shake {
            25% {
                transform: translateX(-8px)
            }

            75% {
                transform: translateX(8px)
            }
        }

        @media(max-width:640px) {
            .pipe {
                grid-template-columns: repeat(2, 1fr);
                row-gap: 30px
            }

            .pipe::before,
            .pipe .fill {
                display: none
            }

            .ask {
                flex-direction: column
            }

            .ask button {
                padding: 14px
            }
        }

        @media(prefers-reduced-motion:reduce) {
            * {
                animation-duration: .01s !important;
                transition-duration: .01s !important
            }
        }

        :focus-visible {
            outline: 2px solid var(--amber);
            outline-offset: 2px
        }
    </style>
</head>

<body>
    <canvas id="bg" aria-hidden="true"></canvas>
    <main>
        <h1 id="title">Four AI agents research it, write it, and review it.</h1>
        <p class="sub">Enter a topic. A search agent finds sources, a reader agent scrapes them, a writer drafts the
            report, and a critic reviews it.</p>

        <div class="ask">
            <input id="topic" type="text" placeholder="e.g. GPT-6 features, capabilities, and latest developments"
                autocomplete="off" aria-label="Research topic">
            <button id="go">Start research</button>
        </div>
        <div class="chips" id="chips">
            <button>GPT-6 features and latest developments</button>
            <button>Quantum computing breakthroughs 2026</button>
            <button>Future of solid-state batteries</button>
        </div>

        <section class="pipe" id="pipe" aria-live="polite">
            <div class="fill" id="fill"></div>
            <div class="node" data-step="search">
                <div class="orb">🔎</div><b>Search agent</b><small>Waiting</small>
            </div>
            <div class="node" data-step="reader">
                <div class="orb">📖</div><b>Reader agent</b><small>Waiting</small>
            </div>
            <div class="node" data-step="writer">
                <div class="orb">✍️</div><b>Writer</b><small>Waiting</small>
            </div>
            <div class="node" data-step="critic">
                <div class="orb">🧐</div><b>Critic</b><small>Waiting</small>
            </div>
        </section>

        <div class="err" id="err"></div>

        <section class="results" id="results">
            <div class="tabs" id="tabs" role="tablist">
                <button class="tab on" data-tab="writer"><span class="dot"></span>Report</button>
                <button class="tab" data-tab="critic"><span class="dot"></span>Critic feedback</button>
                <button class="tab" data-tab="reader"><span class="dot"></span>Scraped content</button>
                <button class="tab" data-tab="search"><span class="dot"></span>Search results</button>
                <span class="ink" id="ink"></span>
            </div>
            <div class="panel" id="panel"></div>
            <div class="tools"><button id="copy">Copy this tab</button></div>
        </section>
    </main>

    <script>
        // hero headline: word-by-word entrance
        const t = document.getElementById('title');
        t.innerHTML = t.textContent.split(' ').map((w, i) => `<span style="animation-delay:${i * 70}ms">${w}</span>`).join(' ');

        // background: drifting particles
        const cv = document.getElementById('bg'), cx = cv.getContext('2d');
        let W, H, dots = [];
        function size() {
            W = cv.width = innerWidth; H = cv.height = innerHeight;
            dots = Array.from({ length: Math.min(70, Math.floor(W / 18)) }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .35, vy: (Math.random() - .5) * .35 }));
        }
        addEventListener('resize', size); size();
        (function draw() {
            cx.clearRect(0, 0, W, H);
            dots.forEach((a, i) => {
                a.x = (a.x + a.vx + W) % W; a.y = (a.y + a.vy + H) % H;
                cx.fillStyle = 'rgba(124,108,255,.55)'; cx.beginPath(); cx.arc(a.x, a.y, 1.6, 0, 7); cx.fill();
                for (let j = i + 1; j < dots.length; j++) {
                    const b = dots[j], d = Math.hypot(a.x - b.x, a.y - b.y);
                    if (d < 130) { cx.strokeStyle = `rgba(79,227,193,${.16 * (1 - d / 130)})`; cx.beginPath(); cx.moveTo(a.x, a.y); cx.lineTo(b.x, b.y); cx.stroke(); }
                }
            });
            requestAnimationFrame(draw);
        })();

        // state
        const steps = ['search', 'reader', 'writer', 'critic'];
        const labels = { search: 'Searching the web…', reader: 'Reading sources…', writer: 'Writing report…', critic: 'Reviewing report…' };
        const store = {}; let current = 'writer', es = null;
        const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];

        function setNode(step, state, text) {
            const n = $(`.node[data-step="${step}"]`);
            n.className = 'node ' + state;
            n.querySelector('small').textContent = text;
            const idx = steps.indexOf(step) + (state === 'done' ? 1 : 0);
            $('#fill').style.width = (76 * Math.min(idx, 3) / 3) + '%';
        }
        function resetUI() {
            steps.forEach(s => setNode(s, '', 'Waiting'));
            $('#fill').style.width = '0';
            Object.keys(store).forEach(k => delete store[k]);
            $$('.tab').forEach(x => x.classList.remove('ready'));
            $('#err').style.display = 'none';
        }
        function moveInk() {
            const on = $('.tab.on'); const i = $('#ink');
            i.style.left = on.offsetLeft + 'px'; i.style.width = on.offsetWidth + 'px';
        }
        function render() {
            const p = $('#panel'); p.style.animation = 'none'; p.offsetHeight; p.style.animation = '';
            if (store[current]) { p.innerHTML = `<div class="md">${marked.parse(store[current])}</div>`; }
            else { p.innerHTML = `<p class="empty typing">${labels[current]} </p>`; }
        }
        function showTab(name) {
            current = name;
            $$('.tab').forEach(x => x.classList.toggle('on', x.dataset.tab === name));
            moveInk(); render();
        }
        $$('.tab').forEach(b => b.onclick = () => showTab(b.dataset.tab));
        addEventListener('resize', moveInk);

        $('#chips').onclick = e => { if (e.target.tagName === 'BUTTON') { $('#topic').value = e.target.textContent; start(); } };
        $('#go').onclick = start;
        $('#topic').addEventListener('keydown', e => { if (e.key === 'Enter') start(); });
        $('#copy').onclick = async e => {
            await navigator.clipboard.writeText(store[current] || '');
            e.target.textContent = 'Copied'; setTimeout(() => e.target.textContent = 'Copy this tab', 1400);
        };

        function start() {
            const topic = $('#topic').value.trim();
            if (!topic) { $('#topic').focus(); return; }
            if (es) es.close();
            resetUI();
            $('#go').disabled = true; $('#go').textContent = 'Researching…';
            $('#results').classList.add('show');
            showTab('writer');
            $('#pipe').scrollIntoView({ behavior: 'smooth', block: 'center' });

            es = new EventSource('/run?topic=' + encodeURIComponent(topic));
            es.onmessage = ev => {
                const m = JSON.parse(ev.data);
                if (m.type === 'start') setNode(m.step, 'active', labels[m.step]);
                if (m.type === 'done') {
                    store[m.step] = m.content;
                    setNode(m.step, 'done', 'Done');
                    $(`.tab[data-tab="${m.step}"]`).classList.add('ready');
                    if (m.step === current) render();
                }
                if (m.type === 'complete') { finish(); showTab('writer'); }
                if (m.type === 'error') {
                    if (m.step) setNode(m.step, 'error', 'Failed');
                    const e = $('#err'); e.style.display = 'block'; e.style.animation = 'none'; e.offsetHeight; e.style.animation = '';
                    e.textContent = 'Something went wrong' + (m.step ? ` in the ${m.step} step` : '') + ': ' + m.message;
                    finish();
                }
            };
            es.onerror = () => { if ($('#go').disabled) { finish(); } };
        }
        function finish() { if (es) es.close(); $('#go').disabled = false; $('#go').textContent = 'Start research'; }
        setTimeout(moveInk, 300);
    </script>
</body>

</html>
